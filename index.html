<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>租客QA 自動文字產生器</title>
    <!-- 引入 LINE 官方 LIFF SDK（關鍵，不能刪） -->
    <script src="https://line-scdn.net"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; color: #333; padding: 15px; margin: 0; }
        .container { max-width: 100%; background: #fff; margin: 0 auto; padding: 20px; border-radius: 8px; box-sizing: border-box; }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 5px; font-size: 20px; }
        .top-notice { text-align: center; font-weight: bold; color: #d93025; background-color: #fce8e6; padding: 8px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; }
        input[type="text"], input[type="date"], input[type="time"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        .radio-group, .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; margin: 5px 0; }
        .radio-item, .checkbox-item { background: #f8f9fa; border: 1px solid #dee2e6; padding: 8px 12px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 13px; }
        .sub-box { background: #e8f0fe; padding: 12px; border-radius: 6px; margin-top: 8px; border-left: 4px solid #1a73e8; }
        .flex-group { display: flex; gap: 10px; }
        .flex-group div { flex: 1; }
        button { width: 100%; background-color: #1a73e8; color: white; border: none; padding: 10px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #1557b0; }
        .send-btn { width: 100%; background-color: #34a853; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        .send-btn:hover { background-color: #2b8a43; }
        .fixed-notice { background: #fff3cd; color: #856404; padding: 8px; border-radius: 4px; font-size: 12px; border-left: 4px solid #ffc107; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏠 租客QA 自動文字產生器</h2>
    <div class="top-notice">📢 請幫我更新到租屋使用表</div>
    
    <!-- 1. 地址 -->
    <div class="form-group">
        <label>📍 物件地址 (簡答)</label>
        <input type="text" id="propertyAddress" placeholder="請輸入該物件的完整地址">
    </div>

    <!-- 2. 型態 -->
    <div class="form-group">
        <label>🏢 房屋型態 (單選)</label>
        <div class="radio-group">
            <label class="radio-item"><input type="radio" name="houseType" value="套房" checked onclick="document.getElementById('typeOtherBox').style.display='none'"> 套房</label>
            <label class="radio-item"><input type="radio" name="houseType" value="1房1廳" onclick="document.getElementById('typeOtherBox').style.display='none'"> 1房1廳</label>
            <label class="radio-item"><input type="radio" name="houseType" value="2房1廳" onclick="document.getElementById('typeOtherBox').style.display='none'"> 2房1廳</label>
            <label class="radio-item"><input type="radio" name="houseType" value="其他" onclick="document.getElementById('typeOtherBox').style.display='block'"> 其他</label>
        </div>
        <div id="typeOtherBox" class="sub-box" style="display: none;">
            <label>請簡述其他型態名稱：</label>
            <input type="text" id="typeOther" placeholder="請打字輸入...">
        </div>
    </div>

    <!-- 📅 帶看時間 -->
    <div class="form-group">
        <label>📅 帶看時間</label>
        <input type="date" id="visitDate">
    </div>

    <!-- ⚡ 電表類型 -->
    <div class="form-group">
        <label>⚡ 電表類型</label>
        <select id="meterType">
            <option value="一般：請租客月底要拍電錶">一般:請租客月底要拍電錶</option>
            <option value="一般：小米監視器拍電錶">一般:小米監視器拍電錶</option>
            <option value="雲端：儲值用電">雲端:儲值用電</option>
        </select>
    </div>

    <!-- 💰 電費 (元/度) -->
    <div class="form-group">
        <label>💰 電費 (元/度)</label>
        <input type="text" id="electricFee" value="5">
    </div>

    <!-- 📝 配套條件 -->
    <div class="form-group">
        <label>📝 配套條件 (可複選)</label>
        <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" class="condition-cb" value="🏠 可租補"> 可租補</label>
            <label class="checkbox-item"><input type="checkbox" class="condition-cb" value="可入籍"> 可入籍</label>
            <label class="checkbox-item"><input type="checkbox" class="condition-cb" value="🐱 可貓"> 可貓</label>
            <label class="checkbox-item"><input type="checkbox" class="condition-cb" value="可報稅"> 可報稅</label>
        </div>
    </div>

    <!-- 🌐 網路類型 -->
    <div class="form-group">
        <label>🌐 網路類型</label>
        <div class="radio-group">
            <label class="radio-item"><input type="radio" name="netType" value="獨立網路" checked onclick="document.getElementById('netLabel').innerText='請輸入獨立網路速度 (Mbps)：'"> 獨立網路</label>
            <label class="radio-item"><input type="radio" name="netType" value="共用網路" onclick="document.getElementById('netLabel').innerText='請輸入共用網路速度 (Mbps)：'"> 共用網路</label>
        </div>
        <div class="sub-box">
            <label id="netLabel">請輸入獨立網路速度 (Mbps)：</label>
            <input type="text" id="netSpeed" value="150 Mbps">
        </div>
    </div>

    <!-- 🗑️ 垃圾處理方式 -->
    <div class="form-group">
        <label>🗑️ 垃圾處理方式</label>
        <div class="radio-group">
            <label class="radio-item"><input type="radio" name="trashType" value="垃圾代收" checked onclick="document.getElementById('trashBagBox').style.display='block'; document.getElementById('trashCarBox').style.display='none'"> 垃圾代收</label>
            <label class="radio-item"><input type="radio" name="trashType" value="垃圾車自追" onclick="document.getElementById('trashBagBox').style.display='none'; document.getElementById('trashCarBox').style.display='block'"> 垃圾車自追</label>
        </div>
        
        <!-- 垃圾代收 -->
        <div id="trashBagBox" class="sub-box" style="display: block;">
            <label>🔹 請選擇收集容器：</label>
            <div class="radio-group" style="margin-bottom: 10px;">
                <label class="radio-item"><input type="radio" name="trashContainerType" value="垃圾袋" checked> 垃圾袋</label>
                <label class="radio-item"><input type="radio" name="trashContainerType" value="垃圾桶"> 垃圾桶</label>
            </div>
            <label>🔹 請勾選租客拿出垃圾的時間：</label>
            <div class="checkbox-group">
                <label class="checkbox-item"><input type="checkbox" class="trash-day-cb" value="一" checked> 一</label>
                <label class="checkbox-item"><input type="checkbox" class="trash-day-cb" value="二"> 二</label>
                <label class="checkbox-item"><input type="checkbox" class="trash-day-cb" value="三"> 三</label>
                <label class="checkbox-item"><input type="checkbox" class="trash-day-cb" value="四" checked> 四</label>
                <label class="checkbox-item"><input type="checkbox" class="trash-day-cb" value="五"> 五</label>
                <label class="checkbox-item"><input type="checkbox" class="trash-day-cb" value="六"> 六</label>
                <label class="checkbox-item"><input type="checkbox" class="trash-day-cb" value="日"> 日</label>
            </div>
        </div>
        
        <!-- 垃圾車自追 -->
        <div id="trashCarBox" class="sub-box" style="display: none;">
            <label>請輸入垃圾車資訊：</label>
            <div class="flex-group">
                <div>
                    <span>📍 地址</span>
                    <input type="text" id="trashCarLocation" value="明德路1段195巷口">
                </div>
                <div>
                    <span>🕒 時間 (24H)</span>
                    <input type="time" id="trashCarTime" value="14:35">
                </div>
            </div>
        </div>
    </div>

    <!-- 📺 房東贈送 -->
    <div class="form-group">
        <label>📺 房東贈送 (可複選)</label>
        <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" class="gift-cb" value="第四台" checked> 第四台</label>
            <label class="checkbox-item"><input type="checkbox" class="gift-cb" value="水費" checked> 水費</label>
            <label class="checkbox-item"><input type="checkbox" class="gift-cb" value="機車停車格"> 機車停車格</label>
            <label class="checkbox-item"><input type="checkbox" class="gift-cb" value="汽車停車格"> 汽車停車格</label>
            <label class="checkbox-item"><input type="checkbox" class="gift-cb" value="公共用電" checked> 公共用電</label>
            <label class="checkbox-item"><input type="checkbox" class="gift-cb" value="公共飲水機"> 公共飲水機</label>
        </div>
    </div>

    <!-- ✨ 房屋優點 -->
    <div class="form-group">
        <label>✨ 房屋優點 (可複選)</label>
        <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" class="adv-cb" value="🧺 獨洗" checked> 獨洗</label>
            <label class="checkbox-item"><input type="checkbox" class="adv-cb" value="☀️ 獨陽台" checked> 獨陽台</label>
            <label class="checkbox-item"><input type="checkbox" class="adv-cb" value="🚰 濾水器"> 濾水器</label>
            <label class="checkbox-item"><input type="checkbox" class="adv-cb" value="🥛 飲水機"> 飲水機</label>
        </div>
    </div>

    <!-- 🔒 固定附帶內容 -->
    <div class="form-group">
        <label>🔒 固定附帶內容 (免填寫)</label>
        <div class="fixed-notice">
            📅 最短1年｜💰 押2<br>
            【資格】連帶保證人、身分證驗證、八大限制、禁菸
        </div>
    </div>

    <!-- ⚠️ 特殊注意事項 -->
    <div class="form-group">
        <label>⚠️ 特殊注意事項 (簡答格)</label>
        <textarea id="specialNotes" rows="2" placeholder="如有其他特殊交代事項請填寫於此..."></textarea>
    </div>

    <!-- 🚀 綠色火箭發送按鈕 -->
    <button class="send-btn" onclick="sendToLine()">🚀 填寫完畢，直接傳送</button>
</div>

<script>
    // 初始化 LINE LIFF 工具
